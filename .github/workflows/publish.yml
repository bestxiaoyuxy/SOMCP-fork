name: Publish APK

on:
  push:
    tags:
      - 'publish/*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          cd $ANDROID_HOME/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build gcc g++ pkg-config \
            gcc-multilib g++-multilib \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            gcc-multilib

      - name: Clone Rizin source (v0.9.1)
        run: |
          if [ ! -d third_party/rizin-src/librz/include ]; then
            git clone --depth 1 --branch v0.9.1 https://github.com/rizinorg/rizin.git third_party/rizin-src
          fi

      - name: Build native backends (Rizin + LIEF)
        run: bash build-native-android.sh

      - name: Build Unidbg native libs (capstone/keystone/unicorn)
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            bash build-unidbg-native.sh --abi "$abi"
          done

      - name: Generate release signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore somcp-release.jks \
            -alias somcp \
            -storepass somcp1234 \
            -keypass somcp1234 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -dname "CN=SOMCP, OU=Dev, O=SOMCP, L=CI, ST=CI, C=US"

      - name: Build APKs (all ABIs)
        run: |
          ./gradlew assembleRelease \
            -PstoreFile=$(pwd)/somcp-release.jks \
            -PstorePassword=somcp1234 \
            -PkeyAlias=somcp \
            -PkeyPassword=somcp1234 \
            --no-daemon \
            --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release
          APP_NAME=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          # Use the tag as the version label if available, otherwise the app versionName
          TAG="${GITHUB_REF_NAME#publish/}"
          if [ -n "$TAG" ] && [ "$TAG" != "$GITHUB_REF_NAME" ]; then
            VERSION="$TAG"
          fi
          echo "Version label: $VERSION"

          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            # Find the APK for this ABI
            APK=$(find app/build/outputs/apk/release -name "*-${abi}-release.apk" -o -name "*-${abi}.apk" 2>/dev/null | head -1)
            if [ -z "$APK" ]; then
              echo "Looking for $abi APK..."
              APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | grep -i "${abi}" | head -1)
            fi
            if [ -n "$APK" ]; then
              cp "$APK" "release/SOMCP-${VERSION}-${abi}.apk"
              echo "  ✓ $(basename "$APK") → SOMCP-${VERSION}-${abi}.apk"
            else
              echo "  ✗ No APK found for $abi"
            fi
          done
          echo "=== Release contents ==="
          ls -lh release/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
