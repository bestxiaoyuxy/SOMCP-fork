name: Publish APK

on:
  push:
    tags:
      - 'publish/*'

permissions:
  contents: write

env:
  NDK_VERSION: 29.0.14206865
  RIZIN_VERSION: v0.9.1
  CLOUDFLARED_TAG: "2026.8.3"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --- Fixed signing keystore (reused across all runs) ---
      - name: Restore keystore
        uses: actions/cache/restore@v4
        with:
          path: release/somcp-release.jks
          key: somcp-fixed-keystore-v1

      - name: Generate keystore if not cached
        if: hashFiles('release/somcp-release.jks') == ''
        run: |
          mkdir -p release
          keytool -genkeypair \
            -keystore release/somcp-release.jks \
            -alias somcp \
            -storepass somcp1234 \
            -keypass somcp1234 \
            -keyalg RSA -keysize 2048 \
            -validity 10950 \
            -dname "CN=SOMCP, OU=Dev, O=SOMCP, L=CI, ST=CI, C=US"

      # --- Android SDK ---
      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          ln -sf /opt/gradle-9.6.1/bin/gradle /usr/local/bin/gradle

      # --- Native build tools ---
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build gcc g++ pkg-config zlib1g-dev

      # --- Clone Rizin source (shared by Rizin build + rz-ghidra + CMake) ---
      - name: Clone Rizin source
        run: |
          if [ ! -d third_party/rizin-src/librz/include ]; then
            git clone --depth 1 --branch ${{ env.RIZIN_VERSION }} https://github.com/rizinorg/rizin.git third_party/rizin-src
          fi

      # ═══════════════════════════════════════════════════════
      # CACHES (restore before build)
      # ═══════════════════════════════════════════════════════
      - name: Cache Rizin + LIEF build
        uses: actions/cache@v4
        with:
          path: |
            rizin-build
            third_party/lief-build
          key: rl-${{ env.NDK_VERSION }}-${{ env.RIZIN_VERSION }}-${{ hashFiles('build-native-android.sh', 'rizin-cross-*.ini', 'rizin-native.ini') }}
          restore-keys: |
            rl-${{ env.NDK_VERSION }}-${{ env.RIZIN_VERSION }}-

      - name: Cache Unidbg jniLibs
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: unidbg-${{ env.NDK_VERSION }}-${{ hashFiles('build-unidbg-native.sh') }}
          restore-keys: |
            unidbg-${{ env.NDK_VERSION }}-

      - name: Cache rz-ghidra
        uses: actions/cache@v4
        with:
          path: |
            rz-ghidra-build
            app/src/main/jniLibs/*/libcore_ghidra.so
          key: rzgh-${{ env.NDK_VERSION }}-${{ env.RIZIN_VERSION }}-${{ hashFiles('build-rz-ghidra-android.sh') }}
          restore-keys: |
            rzgh-${{ env.NDK_VERSION }}-${{ env.RIZIN_VERSION }}-

      - name: Cache cloudflared
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/*/libcloudflared.so
          key: cf-${{ env.CLOUDFLARED_TAG }}
          restore-keys: |
            cf-

      - name: Cache Go module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            /go/pkg/mod
          key: go-mod-${{ env.CLOUDFLARED_TAG }}
          restore-keys: |
            go-mod-

      - name: Cache blutter
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/*/libblutter_*.so
            app/src/main/assets/blutter
          key: blutter-${{ hashFiles('tools/blutter-matrix/build-blutter-runners.sh') }}
          restore-keys: |
            blutter-

      - name: Cache Gradle build
        uses: actions/cache@v4
        with:
          path: .gradle
          key: gradle-${{ hashFiles('app/build.gradle.kts', 'build.gradle.kts') }}
          restore-keys: |
            gradle-

      # ═══════════════════════════════════════════════════════
      # PARALLEL BUILDS (all in same filesystem, no artifacts)
      # ═══════════════════════════════════════════════════════
      - name: Parallel native builds (Rizin+LIEF, Unidbg, rz-ghidra, cloudflared)
        run: |
          set -uo pipefail
          # Launch independent builds in background
          # Rizin + LIEF (no deps)
          bash build-native-android.sh > /tmp/build-rizin.log 2>&1 &
          RIZIN_PID=$!

          # Unidbg (no deps on Rizin)
          (
            set -euo pipefail
            if [ -f "app/src/main/jniLibs/arm64-v8a/libcapstone.so" ] && \
               [ -f "app/src/main/jniLibs/arm64-v8a/libkeystone.so" ] && \
               [ -f "app/src/main/jniLibs/arm64-v8a/libunicorn.so" ] && \
               [ -f "app/src/main/jniLibs/x86_64/libcapstone.so" ] && \
               [ -f "app/src/main/jniLibs/x86_64/libkeystone.so" ] && \
               [ -f "app/src/main/jniLibs/x86_64/libunicorn.so" ]; then
              echo "Unidbg cached, skipping."
            else
              for abi in arm64-v8a armeabi-v7a x86 x86_64; do
                bash build-unidbg-native.sh --abi "$abi"
              done
            fi
          ) > /tmp/build-unidbg.log 2>&1 &
          UNIDBG_PID=$!

          # cloudflared (Go, no deps)
          (
            set -euo pipefail
            if [ -f "app/src/main/jniLibs/arm64-v8a/libcloudflared.so" ] && \
               [ -f "app/src/main/jniLibs/x86_64/libcloudflared.so" ]; then
              echo "cloudflared cached, skipping."
            else
              git clone --depth 1 --branch "${CLOUDFLARED_TAG}" \
                https://github.com/cloudflare/cloudflared.git cloudflared-src
              cd cloudflared-src
              GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" \
                -o ../libcloudflared-arm64-v8a ./cmd/cloudflared
              GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" \
                -o ../libcloudflared-armeabi-v7a ./cmd/cloudflared
              GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" \
                -o ../libcloudflared-x86_64 ./cmd/cloudflared
              GOOS=linux GOARCH=386 CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" \
                -o ../libcloudflared-x86 ./cmd/cloudflared
              cd ..
              for abi in arm64-v8a armeabi-v7a x86_64 x86; do
                mkdir -p "app/src/main/jniLibs/$abi"
                cp "libcloudflared-${abi}" "app/src/main/jniLibs/$abi/libcloudflared.so"
              done
            fi
          ) > /tmp/build-cloudflared.log 2>&1 &
          CF_PID=$!

          # Wait for Rizin+LIEF to finish (rz-ghidra depends on it)
          echo "Waiting for Rizin+LIEF..."
          wait $RIZIN_PID
          RIZIN_EXIT=$?
          if [ $RIZIN_EXIT -ne 0 ]; then
            echo "=== Rizin+LIEF FAILED ==="
            cat /tmp/build-rizin.log
            exit 1
          fi
          echo "Rizin+LIEF done."

          # rz-ghidra (needs Rizin SDK)
          (
            set -euo pipefail
            if [ -f "app/src/main/jniLibs/arm64-v8a/libcore_ghidra.so" ] && \
               [ -f "app/src/main/jniLibs/armeabi-v7a/libcore_ghidra.so" ] && \
               [ -f "app/src/main/jniLibs/x86/libcore_ghidra.so" ] && \
               [ -f "app/src/main/jniLibs/x86_64/libcore_ghidra.so" ]; then
              echo "rz-ghidra cached, skipping."
            else
              bash build-rz-ghidra-android.sh
            fi
          ) > /tmp/build-rzghidra.log 2>&1 &
          RZGH_PID=$!

          # blutter (best-effort, no deps)
          (
            set -euo pipefail
            if [ -f "app/src/main/jniLibs/arm64-v8a/libblutter_5e4949e6decb093d82c1.so" ] && \
               [ -f "app/src/main/assets/blutter/runners.json" ]; then
              echo "blutter cached, skipping."
            else
              bash tools/blutter-matrix/build-blutter-runners.sh
            fi
          ) > /tmp/build-blutter.log 2>&1 &
          BLUTTER_PID=$!

          # Wait for remaining builds
          wait $UNIDBG_PID
          UNIDBG_EXIT=$?
          if [ $UNIDBG_EXIT -ne 0 ]; then
            echo "=== Unidbg FAILED ==="
            cat /tmp/build-unidbg.log
            exit 1
          fi
          echo "Unidbg done."

          wait $CF_PID
          CF_EXIT=$?
          if [ $CF_EXIT -ne 0 ]; then
            echo "=== cloudflared FAILED ==="
            cat /tmp/build-cloudflared.log
            exit 1
          fi
          echo "cloudflared done."

          wait $RZGH_PID
          RZGH_EXIT=$?
          if [ $RZGH_EXIT -ne 0 ]; then
            echo "=== rz-ghidra FAILED ==="
            cat /tmp/build-rzghidra.log
            exit 1
          fi
          echo "rz-ghidra done."

          # blutter is best-effort
          wait $BLUTTER_PID
          BLUTTER_EXIT=$?
          if [ $BLUTTER_EXIT -ne 0 ]; then
            echo "=== blutter FAILED (best-effort, continuing) ==="
            cat /tmp/build-blutter.log
          else
            echo "blutter done."
          fi

          # Verify all outputs
          echo "=== Verifying build outputs ==="
          for abi in arm64-v8a x86_64; do
            for lib in capstone keystone unicorn; do
              test -f "app/src/main/jniLibs/$abi/lib$lib.so" || {
                echo "::error::missing jniLibs/$abi/lib$lib.so"
                exit 1
              }
            done
          done
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "app/src/main/jniLibs/$abi/libcore_ghidra.so" || {
              echo "::error::missing $abi/libcore_ghidra.so"
              exit 1
            }
            test -f "app/src/main/jniLibs/$abi/libcloudflared.so" || {
              echo "::error::missing $abi/libcloudflared.so"
              exit 1
            }
          done
          echo "All native libs verified."

      # --- Build APKs ---
      - name: Build APKs
        env:
          STORE_FILE: ${{ github.workspace }}/release/somcp-release.jks
          STORE_PASSWORD: somcp1234
          KEY_ALIAS: somcp
          KEY_PASSWORD: somcp1234
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: List built APKs
        run: |
          echo "=== APK output ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Collect and rename APKs
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#publish/}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          fi
          echo "Version: $VERSION"

          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            APK=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | grep -i "${abi}" | head -1)
            if [ -n "$APK" ]; then
              cp "$APK" "dist/SOMCP-${VERSION}-${abi}.apk"
              echo "  ✓ $abi → SOMCP-${VERSION}-${abi}.apk"
            else
              echo "  ✗ No APK found for $abi"
            fi
          done

          echo ""
          echo "=== Release files ==="
          ls -lh dist/
          test -n "$(ls dist/*.apk 2>/dev/null)" || {
            echo "::error::No APKs produced."
            exit 1
          }

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
