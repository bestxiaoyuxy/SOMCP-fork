name: Publish APK

on:
  push:
    tags:
      - 'publish/*'

permissions:
  contents: write

env:
  NDK_VERSION: 29.0.14206865
  RIZIN_VERSION: v0.9.1
  CLOUDFLARED_TAG: "2026.8.3"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          # 不设 cache: gradle，Gradle 依赖缓存由下面的 gradle-deps 缓存管理

      # --- Fixed signing keystore (committed to repo) ---
      - name: Verify keystore
        run: |
          ls -la release/somcp-release.jks
          keytool -list -keystore release/somcp-release.jks -storepass somcp1234

      # --- Android SDK: 只缓存我们额外装的组件 (NDK + cmake)，不缓存整个 SDK ---
      # GitHub runner 预装了 platforms + build-tools，只缺 NDK 29 和 cmake
      - name: Restore NDK + CMake cache
        id: ndk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/ndk-cache
          key: ndk-${{ env.NDK_VERSION }}
          restore-keys: |
            ndk-

      - name: Install Android SDK (NDK + CMake)
        run: |
          # 从缓存恢复（如果命中）
          if [ -f "/tmp/ndk-cache/ndk-${{ env.NDK_VERSION }}/source.properties" ]; then
            echo "NDK restored from cache, copying to ANDROID_HOME..."
            mkdir -p "$ANDROID_HOME/ndk"
            cp -r "/tmp/ndk-cache/ndk-${{ env.NDK_VERSION }}" "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
            if [ -d "/tmp/ndk-cache/cmake-3.22.1" ]; then
              mkdir -p "$ANDROID_HOME/cmake"
              cp -r "/tmp/ndk-cache/cmake-3.22.1" "$ANDROID_HOME/cmake/3.22.1"
            fi
            exit 0
          fi
          # 未命中：下载 cmdline-tools + 安装
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"
          # 打包到缓存目录（只打包 NDK + cmake，不含 cmdline-tools/platforms）
          mkdir -p /tmp/ndk-cache
          cp -r "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" /tmp/ndk-cache/ndk-${{ env.NDK_VERSION }}
          cp -r "$ANDROID_HOME/cmake/3.22.1" /tmp/ndk-cache/cmake-3.22.1

      - name: Save NDK + CMake cache
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/ndk-cache
          key: ndk-${{ env.NDK_VERSION }}

      # --- Gradle: 用 gradle/actions/setup-gradle 统一管理发行版+依赖 ---
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      # --- Native build tools ---
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build gcc g++ pkg-config zlib1g-dev

      # --- Clone Rizin source ---
      - name: Clone Rizin source
        run: |
          if [ ! -d third_party/rizin-src/librz/include ]; then
            git clone --depth 1 --branch ${{ env.RIZIN_VERSION }} https://github.com/rizinorg/rizin.git third_party/rizin-src
          fi

      # ═══════════════════════════════════════════════════════
      # CACHES — 统一用 restore + 条件 save（~4GB 总计）
      # ═══════════════════════════════════════════════════════

      # Rizin+LIEF: tar.gz 打包（.a+头文件，~800MB）
      - name: Restore Rizin + LIEF cache
        id: rl-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/rl-cache.tar.gz
          key: rl-tar-${{ env.NDK_VERSION }}-${{ env.RIZIN_VERSION }}
          restore-keys: |
            rl-tar-${{ env.NDK_VERSION }}-

      - name: Extract Rizin + LIEF cache
        id: rl-extract
        if: steps.rl-cache.outputs.cache-hit == 'true'
        run: |
          echo "Extracting Rizin+LIEF cache..."
          tar -xzf /tmp/rl-cache.tar.gz -C /tmp/
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -d "/tmp/rizin-build/$abi" ]; then
              mkdir -p rizin-build
              cp -r "/tmp/rizin-build/$abi" rizin-build/
            fi
          done
          if [ -d "/tmp/lief-build" ]; then
            mkdir -p third_party
            cp -r "/tmp/lief-build" third_party/
          fi
          rm -rf /tmp/rl-cache.tar.gz /tmp/rizin-build /tmp/lief-build
          # 验证提取成功（防静默失败）
          test -f "rizin-build/arm64-v8a/librz/util/librz_util.a" || { echo "::error::Rizin cache corrupted: librz_util.a missing"; exit 1; }
          test -f "third_party/lief-build/arm64-v8a/lib/libLIEF.a" || { echo "::error::LIEF cache corrupted: libLIEF.a missing"; exit 1; }
          echo "Rizin+LIEF cache extracted and verified."

      # Unidbg .so（不在 git）
      - name: Restore Unidbg jniLibs
        id: unidbg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcapstone.so
            app/src/main/jniLibs/arm64-v8a/libkeystone.so
            app/src/main/jniLibs/arm64-v8a/libunicorn.so
            app/src/main/jniLibs/armeabi-v7a/libcapstone.so
            app/src/main/jniLibs/armeabi-v7a/libkeystone.so
            app/src/main/jniLibs/armeabi-v7a/libunicorn.so
            app/src/main/jniLibs/x86/libcapstone.so
            app/src/main/jniLibs/x86/libkeystone.so
            app/src/main/jniLibs/x86/libunicorn.so
            app/src/main/jniLibs/x86_64/libcapstone.so
            app/src/main/jniLibs/x86_64/libkeystone.so
            app/src/main/jniLibs/x86_64/libunicorn.so
          key: unidbg-${{ env.NDK_VERSION }}
          restore-keys: |
            unidbg-

      # rz-ghidra .so（不在 git）
      - name: Restore rz-ghidra
        id: rzgh-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcore_ghidra.so
            app/src/main/jniLibs/armeabi-v7a/libcore_ghidra.so
            app/src/main/jniLibs/x86/libcore_ghidra.so
            app/src/main/jniLibs/x86_64/libcore_ghidra.so
          key: rzgh-${{ env.NDK_VERSION }}-${{ env.RIZIN_VERSION }}
          restore-keys: |
            rzgh-

      # cloudflared .so（不在 git）
      - name: Restore cloudflared
        id: cf-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/armeabi-v7a/libcloudflared.so
            app/src/main/jniLibs/x86/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
          key: cf-${{ env.CLOUDFLARED_TAG }}
          restore-keys: |
            cf-

      # blutter（.so 在 git 里，但 runners.json 不在 → 缓存整个 blutter 目录）
      - name: Restore blutter
        id: blutter-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/assets/blutter
          key: blutter-v1
          restore-keys: |
            blutter-

      # ═══════════════════════════════════════════════════════
      # PHASE 1: Rizin+LIEF (串行，~40min 编译 或 ~1min 缓存恢复)
      # ═══════════════════════════════════════════════════════
      - name: Build Rizin + LIEF (serial, cached)
        run: |
          set -uo pipefail
          if [ -f "rizin-build/arm64-v8a/librz/util/librz_util.a" ] && [ -f "third_party/lief-build/arm64-v8a/lib/libLIEF.a" ]; then
            echo "Rizin+LIEF: cache hit, skipping compile."
          else
            echo "Rizin+LIEF: compiling (this takes ~40min)..."
            bash build-native-android.sh > /tmp/build-rizin.log 2>&1
            RIZIN_EXIT=$?
            if [ $RIZIN_EXIT -ne 0 ]; then
              echo "=== Rizin+LIEF FAILED ==="
              tail -50 /tmp/build-rizin.log
              exit 1
            fi
          fi

          # 打包缓存（只在 cache miss 时打包+上传）
          if [ "${{ steps.rl-cache.outputs.cache-hit }}" != "true" ]; then
            echo "=== Packing Rizin+LIEF cache ==="
            rm -rf /tmp/rl-pack && mkdir -p /tmp/rl-pack
            for abi in arm64-v8a armeabi-v7a x86 x86_64; do
              if [ -d "rizin-build/$abi" ]; then
                mkdir -p "/tmp/rl-pack/rizin-build/$abi"
                if [ -d "rizin-build/$abi/librz" ]; then
                  cp -r "rizin-build/$abi/librz" "/tmp/rl-pack/rizin-build/$abi/"
                fi
                if [ -d "rizin-build/$abi/subprojects" ]; then
                  find "rizin-build/$abi/subprojects" -name "*.a" -exec cp --parents {} "/tmp/rl-pack/rizin-build/$abi/" \;
                  find "rizin-build/$abi/subprojects" -type d -name "include" -exec cp -r --parents {} "/tmp/rl-pack/rizin-build/$abi/" \;
                fi
              fi
            done
            if [ -d "third_party/lief-build" ]; then
              mkdir -p /tmp/rl-pack/lief-build
              for abi in arm64-v8a armeabi-v7a x86 x86_64; do
                if [ -f "third_party/lief-build/$abi/lib/libLIEF.a" ]; then
                  mkdir -p "/tmp/rl-pack/lief-build/$abi/lib"
                  cp "third_party/lief-build/$abi/lib/libLIEF.a" "/tmp/rl-pack/lief-build/$abi/lib/"
                fi
              done
            fi
            cd /tmp/rl-pack && tar -czf /tmp/rl-cache.tar.gz . && cd -
            echo "Rizin+LIEF cache packed: $(du -sh /tmp/rl-cache.tar.gz | cut -f1)"
          else
            echo "Rizin+LIEF cache hit — skipping pack (no re-upload)."
          fi

      # --- Save Rizin + LIEF cache ---
      # 注意：不用 hashFiles 守卫——它在 step 开始前评估，打包的文件还不存在。
      # 打包在 Build Rizin+LIEF step 内完成（仅 cache miss 时），所以此处的条件足够。
      - name: Save Rizin + LIEF cache
        if: steps.rl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/rl-cache.tar.gz
          key: rl-tar-${{ env.NDK_VERSION }}-${{ env.RIZIN_VERSION }}

      # ═══════════════════════════════════════════════════════
      # PHASE 2: Unidbg + rz-ghidra + cloudflared + blutter (并行)
      # ═══════════════════════════════════════════════════════
      - name: Parallel builds (Unidbg, rz-ghidra, cloudflared, blutter)
        run: |
          set -uo pipefail

          # Unidbg（build-unidbg-native.sh 内部按 ABI 隔离构建目录，无竞态）
          (
            set -uo pipefail
            if [ -f "app/src/main/jniLibs/arm64-v8a/libcapstone.so" ] && \
               [ -f "app/src/main/jniLibs/arm64-v8a/libkeystone.so" ] && \
               [ -f "app/src/main/jniLibs/arm64-v8a/libunicorn.so" ] && \
               [ -f "app/src/main/jniLibs/x86_64/libcapstone.so" ] && \
               [ -f "app/src/main/jniLibs/x86_64/libkeystone.so" ] && \
               [ -f "app/src/main/jniLibs/x86_64/libunicorn.so" ]; then
              echo "Unidbg cached, skipping."
            else
              for abi in arm64-v8a armeabi-v7a x86 x86_64; do
                echo "=== Unidbg $abi ==="
                if ! bash build-unidbg-native.sh --abi "$abi"; then
                  echo "UNIDBG_FAIL=$abi"
                  exit 1
                fi
              done
            fi
            echo "Unidbg OK"
          ) > /tmp/build-unidbg.log 2>&1 &
          UNIDBG_PID=$!

          # rz-ghidra（Rizin+LIEF 已就绪）
          (
            set -uo pipefail
            if [ -f "app/src/main/jniLibs/arm64-v8a/libcore_ghidra.so" ] && \
               [ -f "app/src/main/jniLibs/armeabi-v7a/libcore_ghidra.so" ] && \
               [ -f "app/src/main/jniLibs/x86/libcore_ghidra.so" ] && \
               [ -f "app/src/main/jniLibs/x86_64/libcore_ghidra.so" ]; then
              echo "rz-ghidra cached, skipping."
            else
              if ! bash build-rz-ghidra-android.sh; then
                echo "RZGHIDRA_FAIL"
                exit 1
              fi
            fi
            echo "rz-ghidra OK"
          ) > /tmp/build-rzghidra.log 2>&1 &
          RZGH_PID=$!

          # cloudflared（纯 Go，CGO_ENABLED=0，GOOS=android 需要 Go 1.21+）
          (
            set -uo pipefail
            if [ -f "app/src/main/jniLibs/arm64-v8a/libcloudflared.so" ] && \
               [ -f "app/src/main/jniLibs/x86_64/libcloudflared.so" ]; then
              echo "cloudflared cached, skipping."
            else
              echo "go version: $(go version)"
              git clone --depth 1 --branch "${CLOUDFLARED_TAG}" \
                https://github.com/cloudflare/cloudflared.git cloudflared-src
              cd cloudflared-src
              # 与原作者/上次成功发布版本保持一致（GOOS=linux，CGO_ENABLED=0 纯静态）
              GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" \
                -o ../libcloudflared-arm64-v8a ./cmd/cloudflared
              GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" \
                -o ../libcloudflared-armeabi-v7a ./cmd/cloudflared
              GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" \
                -o ../libcloudflared-x86_64 ./cmd/cloudflared
              GOOS=linux GOARCH=386 CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" \
                -o ../libcloudflared-x86 ./cmd/cloudflared
              cd ..
              for abi in arm64-v8a armeabi-v7a x86_64 x86; do
                mkdir -p "app/src/main/jniLibs/$abi"
                cp "libcloudflared-${abi}" "app/src/main/jniLibs/$abi/libcloudflared.so"
              done
            fi
            echo "cloudflared OK"
          ) > /tmp/build-cloudflared.log 2>&1 &
          CF_PID=$!

          # blutter (best-effort)
          (
            set -uo pipefail
            if [ -f "app/src/main/jniLibs/arm64-v8a/libblutter_5e4949e6decb093d82c1.so" ] && \
               [ -f "app/src/main/assets/blutter/runners.json" ]; then
              echo "blutter cached, skipping."
            else
              if bash tools/blutter-matrix/build-blutter-runners.sh; then
                echo "blutter OK"
              else
                echo "BLUTTER_FAIL (best-effort)"
              fi
            fi
          ) > /tmp/build-blutter.log 2>&1 &
          BLUTTER_PID=$!

          # 收集并行结果（失败时输出完整日志）
          FAILED=0

          wait $UNIDBG_PID
          if [ $? -ne 0 ]; then
            echo "=== Unidbg FAILED (full log) ==="
            cat /tmp/build-unidbg.log
            FAILED=1
          else
            echo "Unidbg done."
          fi

          wait $CF_PID
          if [ $? -ne 0 ]; then
            echo "=== cloudflared FAILED (full log) ==="
            cat /tmp/build-cloudflared.log
            FAILED=1
          else
            echo "cloudflared done."
          fi

          wait $RZGH_PID
          if [ $? -ne 0 ]; then
            echo "=== rz-ghidra FAILED (full log) ==="
            cat /tmp/build-rzghidra.log
            FAILED=1
          else
            echo "rz-ghidra done."
          fi

          wait $BLUTTER_PID
          if [ $? -ne 0 ]; then
            echo "=== blutter FAILED (best-effort, continuing) ==="
            cat /tmp/build-blutter.log
          else
            echo "blutter done."
          fi

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

          # 验证产物
          echo "=== Verifying build outputs ==="
          for abi in arm64-v8a x86_64; do
            for lib in capstone keystone unicorn; do
              test -f "app/src/main/jniLibs/$abi/lib$lib.so" || {
                echo "::error::missing jniLibs/$abi/lib$lib.so"
                exit 1
              }
            done
          done
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "app/src/main/jniLibs/$abi/libcore_ghidra.so" || {
              echo "::error::missing $abi/libcore_ghidra.so"
              exit 1
            }
            test -f "app/src/main/jniLibs/$abi/libcloudflared.so" || {
              echo "::error::missing $abi/libcloudflared.so"
              exit 1
            }
          done
          echo "All native libs verified."

      # --- Save other caches (only if we built them) ---
      - name: Save Unidbg cache
        if: steps.unidbg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcapstone.so
            app/src/main/jniLibs/arm64-v8a/libkeystone.so
            app/src/main/jniLibs/arm64-v8a/libunicorn.so
            app/src/main/jniLibs/armeabi-v7a/libcapstone.so
            app/src/main/jniLibs/armeabi-v7a/libkeystone.so
            app/src/main/jniLibs/armeabi-v7a/libunicorn.so
            app/src/main/jniLibs/x86/libcapstone.so
            app/src/main/jniLibs/x86/libkeystone.so
            app/src/main/jniLibs/x86/libunicorn.so
            app/src/main/jniLibs/x86_64/libcapstone.so
            app/src/main/jniLibs/x86_64/libkeystone.so
            app/src/main/jniLibs/x86_64/libunicorn.so
          key: unidbg-${{ env.NDK_VERSION }}

      - name: Save rz-ghidra cache
        if: steps.rzgh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcore_ghidra.so
            app/src/main/jniLibs/armeabi-v7a/libcore_ghidra.so
            app/src/main/jniLibs/x86/libcore_ghidra.so
            app/src/main/jniLibs/x86_64/libcore_ghidra.so
          key: rzgh-${{ env.NDK_VERSION }}-${{ env.RIZIN_VERSION }}

      - name: Save cloudflared cache
        if: steps.cf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/armeabi-v7a/libcloudflared.so
            app/src/main/jniLibs/x86/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
          key: cf-${{ env.CLOUDFLARED_TAG }}

      - name: Save blutter cache
        if: steps.blutter-cache.outputs.cache-hit != 'true' && hashFiles('app/src/main/assets/blutter/runners.json') != ''
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/blutter
          key: blutter-v1

      # --- Build APKs ---
      - name: Build APKs
        env:
          STORE_FILE: ${{ github.workspace }}/release/somcp-release.jks
          STORE_PASSWORD: somcp1234
          KEY_ALIAS: somcp
          KEY_PASSWORD: somcp1234
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: List built APKs
        run: |
          echo "=== APK output ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Collect and rename APKs
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#publish/}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          fi
          echo "Version: $VERSION"

          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            # 优先按 ABI 目录匹配，避免 universal 误匹配
            APK=$(find app/build/outputs/apk -path "*/$abi/*" -name "*.apk" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find app/build/outputs/apk -name "*${abi}*.apk" 2>/dev/null | grep -vi universal | head -1)
            [ -z "$APK" ] && APK=$(find app/build/outputs/apk -name "*${abi}*.apk" 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              cp "$APK" "dist/SOMCP-${VERSION}-${abi}.apk"
              echo "  ✓ $abi → SOMCP-${VERSION}-${abi}.apk"
            else
              echo "  ✗ No APK found for $abi"
            fi
          done

          echo ""
          echo "=== Release files ==="
          ls -lh dist/
          test -n "$(ls dist/*.apk 2>/dev/null)" || {
            echo "::error::No APKs produced."
            exit 1
          }

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
        # GitHub API 偶发超时（"couldn't respond in time"），
        # 标记 continue-on-error 避免整个 run 失败；
        # 失败时可手动重推 tag 重试（构建全走缓存，几分钟完成）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
