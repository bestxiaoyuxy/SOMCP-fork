name: Publish APK

on:
  push:
    tags:
      - 'publish/*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          ln -sf /opt/gradle-9.6.1/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build gcc g++ pkg-config \
            zlib1g-dev

      - name: Clone Rizin source (v0.9.1)
        run: |
          if [ ! -d third_party/rizin-src/librz/include ]; then
            git clone --depth 1 --branch v0.9.1 https://github.com/rizinorg/rizin.git third_party/rizin-src
          fi

      - name: Build native backends (Rizin + LIEF)
        run: bash build-native-android.sh

      - name: Build Unidbg native libs (capstone/keystone/unicorn)
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            bash build-unidbg-native.sh --abi "$abi"
          done

      - name: Generate release signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore somcp-release.jks \
            -alias somcp \
            -storepass somcp1234 \
            -keypass somcp1234 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -dname "CN=SOMCP, OU=Dev, O=SOMCP, L=CI, ST=CI, C=US"

      - name: Build APKs
        run: |
          gradle assembleRelease \
            -PstoreFile=$(pwd)/somcp-release.jks \
            -PstorePassword=somcp1234 \
            -PkeyAlias=somcp \
            -PkeyPassword=somcp1234 \
            --no-daemon \
            --stacktrace

      - name: List built APKs
        run: |
          echo "=== APK output directory ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Collect and rename APKs
        run: |
          mkdir -p release
          VERSION="${GITHUB_REF_NAME#publish/}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          fi
          echo "Version label: $VERSION"

          # Map each ABI to its expected APK filename
          declare -A ABI_PATTERNS=(
            ["arm64-v8a"]="arm64-v8a"
            ["armeabi-v7a"]="armeabi-v7a"
            ["x86"]="x86"
            ["x86_64"]="x86_64"
            ["universal"]="universal"
          )

          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            APK=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | grep -i "${abi}" | head -1)
            if [ -n "$APK" ]; then
              cp "$APK" "release/SOMCP-${VERSION}-${abi}.apk"
              echo "  ✓ $abi → SOMCP-${VERSION}-${abi}.apk"
            else
              echo "  ✗ No APK found for $abi"
            fi
          done

          echo ""
          echo "=== Release contents ==="
          ls -lh release/
          test -d release/ && test -n "$(ls release/*.apk 2>/dev/null)" || {
            echo "::error::No APKs were produced. Check the build log above."
            exit 1
          }

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
